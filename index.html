<!DOCTYPE html>
<html lang="en">

<head>
    <title>Glass Credit Card</title>

    <!-- Roboto Font -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
     <div class="container">

        <div class="circle"></div>
        <div class="circle"></div>

        <div class="card">

            <div class="background">
                <img src="images/world.png">
            </div>

            <div class="header">
                <img src="images/circles.png">
            </div>

            <div class="main">
                <span>1987</span>
                <span>2828</span>
                <span>8888</span>
                <span>9494</span>
            </div>

            <div class="footer">
                <div class="col-6">
                    <div class="holder">
                        <span>Card Holder</span>
                        <p>Eduardo Godinez</p>
                    </div>
                    <div class="expiry">
                        <span>Expires</span>
                        <p>08/25</p>
                    </div>
                </div>
                <div class="col-6">
                    <img src="images/visa.png">
                </div>
            </div>

        </div>

    </div>

    <script type="text/javascript" src="js/vanilla-tilt.js"></script>
    <script type="text/javascript">
        VanillaTilt.init(document.querySelector(".card"), {
            max: 20,
            speed: 400,
            glare: true,
            "max-glare": 0.2,
            scale: 1.1,
        });

    </script>
</body>

</html>
